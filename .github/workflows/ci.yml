name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.3.1"
          poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest -q

      - name: Download verified models
        run: ./scripts/download_models.sh

      - name: Build size-gated ad hoc DMG
        run: MAX_DMG_SIZE_MB=200 ./build_dmg.sh
