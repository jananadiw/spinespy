name: Stage macOS release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spinespy-release
  cancel-in-progress: false

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.version.outputs.should-release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect a version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(awk -F '"' '/^version = / { print $2; exit }' pyproject.toml)"
          previous_version="$(git show "${GITHUB_SHA}^:pyproject.toml" | awk -F '"' '/^version = / { print $2; exit }')"

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$current_version" == "$previous_version" ]]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - "$previous_version" "$current_version" "$GITHUB_EVENT_NAME" <<'PY'
          import re
          import sys

          previous, current, event_name = sys.argv[1:]
          pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          if not pattern.fullmatch(current):
              raise SystemExit(f"Release version must be x.y.z, got {current!r}")
          if event_name != "workflow_dispatch" and pattern.fullmatch(previous):
              if tuple(map(int, current.split("."))) <= tuple(map(int, previous.split("."))):
                  raise SystemExit(
                      f"Release version must increase: {previous} -> {current}"
                  )
          PY

          expected_heading="# SpineSpy ${current_version}"
          actual_heading="$(sed -n '1p' RELEASE_NOTES.md)"
          [[ "$actual_heading" == "$expected_heading" ]] || {
            echo "RELEASE_NOTES.md must start with '${expected_heading}'." >&2
            exit 1
          }

          echo "should-release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${current_version}" >> "$GITHUB_OUTPUT"

  stage-release:
    needs: detect-release
    if: needs.detect-release.outputs.should-release == 'true'
    runs-on: macos-15
    environment: release-signing
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.detect-release.outputs.tag }}
      NOTARY_PROFILE: spinespy-notary-ci
      EXPECTED_TEAM_ID: FWFFM858T2
      CODESIGN_IDENTITY: "Developer ID Application: Chathurika Wedagedara (FWFFM858T2)"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the pinned release toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.3.1"
          brew install create-dmg
          create-dmg --version | grep "1.3.0"

      - name: Import signing and notarization credentials
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            NOTARY_KEY_P8_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            [[ -n "${!required:-}" ]] || {
              echo "Missing release-signing secret: ${required}" >&2
              exit 1
            }
          done

          keychain_path="$RUNNER_TEMP/spinespy-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"

          echo "NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_FILE=$notary_key_path" >> "$GITHUB_ENV"

      - name: Create the release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "$GITHUB_SHA" ]] || {
              echo "${RELEASE_TAG} already points to a different commit." >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "SpineSpy ${RELEASE_TAG}" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Build, sign, notarize, and stage the draft
        shell: bash
        run: ./scripts/release_local.sh stage "$RELEASE_TAG"

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_KEYCHAIN:-}" && "$SIGNING_KEYCHAIN" == "$RUNNER_TEMP/"* ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          for credential_file in "${SIGNING_CERTIFICATE:-}" "${NOTARY_KEY_FILE:-}"; do
            if [[ -n "$credential_file" && "$credential_file" == "$RUNNER_TEMP/"* ]]; then
              rm -f -- "$credential_file"
            fi
          done
