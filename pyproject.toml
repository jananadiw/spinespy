[tool.poetry]
name = "spinespy"
version = "1.2.2"
description = "AI-powered posture & focus monitor for macOS menubar"
authors = ["jananadiw"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
opencv-contrib-python = ">=4.13.0.90,<5.0.0"
mediapipe = "^0.10.0"
rumps = "^0.4.0"
pyobjc-framework-Cocoa = "^12.1"
pyobjc-framework-UniformTypeIdentifiers = "^12.1"
pillow = ">=12.3.0,<13.0.0"

[tool.poetry.scripts]
start = "spinespy.cli:start"
test-phone = "spinespy.cli:test_phone"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyinstaller (>=6.18.0,<7.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
    "setuptools (>=83.0.0,<84.0.0)"
]
